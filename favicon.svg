<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="32" height="32" rx="8" fill="url(#shine)"/>

  <!-- Open book shape -->
  <!-- Left page -->
  <path d="M6 10 C6 9 7 8.5 8 8.5 L15 9.5 L15 23 L8 22 C7 21.8 6 21.2 6 20 Z"
        fill="white" opacity="0.95"/>
  <!-- Right page -->
  <path d="M26 10 C26 9 25 8.5 24 8.5 L17 9.5 L17 23 L24 22 C25 21.8 26 21.2 26 20 Z"
        fill="white" opacity="0.85"/>
  <!-- Spine -->
  <rect x="15" y="9" width="2" height="14" rx="1" fill="#99f6e4"/>

  <!-- Lines on left page -->
  <line x1="8.5" y1="13" x2="13.5" y2="13.3" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="8.5" y1="15.5" x2="13.5" y2="15.8" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="8.5" y1="18" x2="13.5" y2="18.3" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Lines on right page -->
  <line x1="18.5" y1="13.3" x2="23.5" y2="13" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="18.5" y1="15.8" x2="23.5" y2="15.5" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="18.5" y1="18.3" x2="23.5" y2="18" stroke="#0d9488" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- Small crescent moon top-right for Islamic touch -->
  <path d="M25 5.5 A3 3 0 1 1 25 5.499 A2 2 0 1 0 25 5.5 Z"
        fill="#fbbf24" opacity="0.9"/>
</svg>
